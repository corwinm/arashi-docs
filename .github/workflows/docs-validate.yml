name: Docs Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "contracts/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - "tsconfig.json"
      - "netlify.toml"
      - "src/content.config.ts"
      - ".github/workflows/docs-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate docs quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation
        run: pnpm validate

      - name: Exercise worktree-naming semantic drift fixtures
        run: pnpm test:worktree-naming-docs
