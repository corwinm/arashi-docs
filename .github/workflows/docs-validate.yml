name: Docs Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "contracts/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - "tsconfig.json"
      - "netlify.toml"
      - "src/content.config.ts"
      - ".github/workflows/docs-validate.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "contracts/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - "tsconfig.json"
      - "netlify.toml"
      - "src/content.config.ts"
      - ".github/workflows/docs-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate docs quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify semantic docs registration
        run: pnpm validate:semantic-docs:registration

      - name: Validate documentation
        run: pnpm validate

  publish-gate:
    name: Publish gate status
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - name: Confirm production publication gate
        run: |
          echo "All blocking checks passed on main."
          echo "Netlify production deployment may proceed from the default branch."
