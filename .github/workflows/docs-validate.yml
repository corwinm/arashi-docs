name: Docs Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "package.json"
      - "tsconfig.json"
      - "netlify.toml"
      - "src/content.config.ts"
      - ".github/workflows/docs-validate.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "package.json"
      - "tsconfig.json"
      - "netlify.toml"
      - "src/content.config.ts"
      - ".github/workflows/docs-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate docs quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run markdown lint baseline
        run: pnpm lint

      - name: Run docs build and type checks
        run: pnpm validate:build

      - name: Run internal link and anchor checks
        run: pnpm validate:links:internal

      - name: Run accessibility smoke checks
        run: pnpm validate:a11y

      - name: Enforce canonical docs domain policy
        run: pnpm validate:docs-domain

      - name: Check README documentation link health
        run: pnpm validate:readme-link

  publish-gate:
    name: Publish gate status
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - name: Confirm production publication gate
        run: |
          echo "All blocking checks passed on main."
          echo "Netlify production deployment may proceed from the default branch."
