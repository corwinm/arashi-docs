[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm validate && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.33.2"

[context.production]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm validate && pnpm build"

[context.deploy-preview]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm lint && pnpm validate:build && pnpm validate:links:internal && pnpm validate:a11y"

[context.branch-deploy]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm lint && pnpm validate:build && pnpm validate:links:internal"

[[redirects]]
  from = "/install"
  to = "https://raw.githubusercontent.com/corwinm/arashi/main/scripts/install.sh"
  status = 302
  force = true

[[redirects]]
  from = "/install/"
  to = "https://raw.githubusercontent.com/corwinm/arashi/main/scripts/install.sh"
  status = 302
  force = true

[[redirects]]
  from = "/install.ps1"
  to = "https://raw.githubusercontent.com/corwinm/arashi/main/scripts/install.ps1"
  status = 302
  force = true

[[redirects]]
  from = "/install.ps1/"
  to = "https://raw.githubusercontent.com/corwinm/arashi/main/scripts/install.ps1"
  status = 302
  force = true
